[project]
name = "ft-llm-instruct"
version = "0.1.0"
description = ""
authors = [
    {name = "Elnur Garashov",email = "garashovelnur@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bitsandbytes (>=0.49.0,<0.50.0)",
    "accelerate (>=1.12.0,<2.0.0)",
    "xformers (>=0.0.33.post2,<0.0.34)",
    "peft (>=0.18.0,<0.19.0)",
    "trl (>=0.18.2,<=0.24.0)",
    "unsloth (==2025.11.6)",
    "unsloth-zoo (==2025.11.6)",
    "cut-cross-entropy (>=25.1.1,<26.0.0)",
    "datasets (>=3.4.1,<4.4.0)",
    "huggingface-hub (>=0.30.0,<1.0)",
    "sentencepiece (>=0.2.1,<0.3.0)",
    "protobuf (>=6.33.2,<7.0.0)",
    "hf-transfer (>=0.1.9,<0.2.0)",
    "torch (>=2.9.1,<3.0.0)",
    "mlflow (>=3.8.0,<4.0.0)",
    "psutil (>=7.2.0,<8.0.0)",
    'triton (>=3.5.1,<4.0.0); sys_platform != "win32"'
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-gpu"}
